# Apple keyboards: the top row sends media keys (brightness, volume, playback) by default and F1-F12
# with Fn held, as on macOS; GNOME handles the media keys itself. Read when hid_apple loads, which is
# from the initramfs (dracut.conf.d/90-silverblue-asahi-apple-hid.conf), so this file must be in the
# image before the initramfs is rebuilt.
options hid_apple fnmode=1
