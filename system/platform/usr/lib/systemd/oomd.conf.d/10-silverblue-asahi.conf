# Without an OOM daemon there is nothing between "memory is tight" and "processes start dying at
# random". The kernel OOM killer only fires once an allocation has already failed outright, which is
# far too late for the desktop: the machine thrashes in reclaim until something fails somewhere
# fatal (seen as the compositor taking SIGBUS from a client's shm pool torn down by the same
# pressure). One app misbehaving should not cost the whole session.
#
# systemd-oomd keys on PSI stall time rather than on free pages, so it acts while the machine is
# still thrashing instead of after an allocation failed: a cgroup is acted on once it has spent more
# than its limit of the time stalled on memory reclaim for 20s straight. Fedora's
# 10-oomd-defaults.conf sets the same 20s (systemd's own default is 30s); restating it keeps the
# image's choice from depending on that.
#
# The limits are per unit and do not belong here: Fedora's systemd-oomd-defaults sets an explicit
# ManagedOOMMemoryPressureLimit=80% on system.slice and on every slice of the user manager, and an
# explicit limit overrides DefaultMemoryPressureLimit=, so a default set here would never apply. The
# image lowers app.slice's limit in /usr/lib/systemd/user/app.slice.d/10-silverblue-asahi-oomd.conf.
[OOM]
DefaultMemoryPressureDurationSec=20s
