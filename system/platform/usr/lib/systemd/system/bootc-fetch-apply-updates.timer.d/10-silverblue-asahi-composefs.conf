# bootc gates its automatic updates on /run/ostree-booted, which only an ostree boot writes: a
# composefs-native boot never does (bootc's own generator notes it), so on this image
# `systemctl enable --now bootc-fetch-apply-updates.timer` would be accepted and then never fire.
# The image only boots as a bootc deployment, and bootc's composefs backend supports
# `upgrade --apply`, so drop the gate. An empty Condition*= resets every condition of the unit
# (systemd.unit(5)); this was its only one. The timer stays disabled: enabling it is the user's call.
[Unit]
ConditionPathExists=
