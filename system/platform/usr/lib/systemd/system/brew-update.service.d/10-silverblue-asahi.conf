# ublue's brew-update.service runs `brew update` from its timer as a fixed User=1000, gated only on
# the unpacked prefix, which brew-setup.service creates at boot. Here the account comes from GNOME
# Initial Setup whenever someone gets through it, and silverblue-asahi-brew-setup re-owns the prefix
# to that account, which need not be uid 1000. So:
#  - wait for silverblue-asahi-brew-setup to have applied the Brewfile. Before that there may be no
#    account at all (the unit would fail with 217/USER and show in `systemctl --failed`), and
#    `brew bundle` may still be installing into the same prefix. Conditions are checked before
#    User= is resolved, so a missing account skips the unit instead of failing it.
#  - run as whoever owns the prefix, not as uid 1000: start as root and drop to the owner with
#    runuser, which also sets HOME for it. The stamp is written only after the re-own, so the owner
#    is the account by then; brew itself refuses to run as root.
[Unit]
ConditionPathExists=/var/lib/silverblue-asahi/brew-setup-done

[Service]
User=
ExecStart=
ExecStart=/usr/bin/bash -c 'exec /usr/bin/runuser -u "$(stat -c %%U /home/linuxbrew/.linuxbrew)" -- /home/linuxbrew/.linuxbrew/bin/brew update'
