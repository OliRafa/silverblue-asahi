# Administrators use Docker without sudo: the socket belongs to wheel instead of the docker group.
#
# The account GNOME Initial Setup creates is an administrator (wheel), and it is created from GDM
# with nothing hooking in to add it to a "docker" group as well. Adding it after the fact, from a unit
# watching /etc/group, would race the session GNOME Initial Setup starts right away, and group
# membership only takes effect at the next login. Owning the socket by wheel gives every
# administrator access from their first session, and standard users none.
#
# This is the trade Docker's own post-install step (the docker group) makes, and it is not free:
# the socket is root without a password. wheel can become root through sudo too, but sudo asks for
# the password, and that prompt is what stands between root and anything else running as the
# account (a build script, an editor plugin, a dependency's install hook). With the socket, it can
# start a privileged container instead. To keep that prompt, override this with
# `sudo systemctl edit docker.socket` (`[Socket]` `SocketGroup=root`) and use `sudo docker`, or use
# rootless Podman.
[Socket]
SocketGroup=wheel
