# Fedora's atomic desktops rebuild the AppStream cache on every boot, because /var (where it lives)
# is not updated with the OS, so the cache would describe the apps of the image it was first built
# from. The unit is gated on /run/ostree-booted, which a composefs-native boot never writes, so here
# it would never run. Drop that gate. An empty Condition*= resets every condition of the unit
# (systemd.unit(5)), so the other one is restated.
[Unit]
ConditionPathExists=
ConditionPathIsReadWrite=/var
