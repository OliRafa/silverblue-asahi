# Fedora's atomic desktops rebuild the man-db index on every boot, because /var/cache/man is not
# updated with the OS (without it, `man -k` and `apropos` know nothing about the image's pages). The
# unit is gated on /run/ostree-booted, which a composefs-native boot never writes, so here it would
# never run. Drop that gate. An empty Condition*= resets every condition of the unit
# (systemd.unit(5)), so the other one is restated.
[Unit]
ConditionPathExists=
ConditionPathIsReadWrite=/var
