# Make user apps the first thing systemd-oomd kills.
#
# Fedora's systemd-oomd-defaults already makes every slice of the user manager a kill candidate at
# 80% memory pressure (/usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf): app.slice,
# session.slice and the user's root slice alike. GNOME Shell runs in session.slice
# (org.gnome.Shell@wayland.service), while every app it launches lands in app.slice as its own
# app-gnome-<app>-<pid>.scope. Lowering app.slice's limit to 50% has oomd act on apps at a lower
# pressure than on the session, so when the machine thrashes it takes the browser or terminal that
# caused the pressure, and the session survives to show the notification about it. That is an
# ordering, not immunity: session.slice keeps Fedora's 80% as the backstop for pressure stalled
# inside the session itself. platform-smoke.sh asserts the effective values from systemd's own unit
# loader, so a change to Fedora's defaults shows up in CI.
#
# ManagedOOMSwap=kill adds swap-based killing for apps, which Fedora enables nowhere: once swap
# (zram) is more than 90% used (oomd's SwapUsedLimit), oomd kills the app using the most swap.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMSwap=kill
