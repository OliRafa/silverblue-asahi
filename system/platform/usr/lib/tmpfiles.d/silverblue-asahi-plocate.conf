# plocate packages /var/lib/plocate (and a CACHEDIR.TAG in it) but ships no tmpfiles entry. /var is
# seeded from the image only on the first install, so a deployment that came by `bootc switch` from
# an image without plocate would never get the directory, and plocate-updatedb.timer (enabled by
# Fedora's 90-default.preset) would fail every day. Create both at boot instead; the Containerfile's
# last step removes the packaged copies, so `bootc container lint` finds no untracked /var content.
# The tag only has to start with this signature (https://bford.info/cachedir/).
d /var/lib/plocate 0755 root root -
f /var/lib/plocate/CACHEDIR.TAG 0644 root root - Signature: 8a477f597d28d172789f06886806bc55
